name: Relay Box Tester CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-firmware:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Environment
        run: docker build -t stm32-env .

      - name: Run SIL Tests
        run: >
          docker run --rm 
          --user $(id -u):$(id -g)
          -v ${{ github.workspace }}:/workspace 
          -w /workspace/tests 
          stm32-env ceedling test:all

      - name: Compile STM32 Firmware
        run: >
          docker run --rm 
          --user $(id -u):$(id -g)
          -v ${{ github.workspace }}:/workspace 
          -w /workspace/firmware 
          stm32-env make

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: firmware/build/*.elf
          retention-days: 5
